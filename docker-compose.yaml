version: '3.8'

services:
  # 1. LiveKit Server
  livekit:
    image: livekit/livekit-server:latest
    command: --config /livekit.yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/livekit.yaml
    depends_on:
      - redis

  # 2. Redis (The Message Bus)
  redis:
    image: redis:7-alpine
    command: redis-server --bind 127.0.0.1
    restart: unless-stopped
    network_mode: host

  # 3. Egress (The Recorder)
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_ADMIN
    environment:
      - EGRESS_CONFIG_FILE=/egress.yaml
    volumes:
      - ./egress.yaml:/egress.yaml
      - /tmp:/tmp
      - /var/www/html/egress-layout:/home/egress/layout
    depends_on:
      - livekit
      - redis
